name: Build

on:
  # push only: a pull_request trigger ran every push twice (same commit, two refs)
  push:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Check trait ids
        run: python3 .github/scripts/check_trait_ids.py

      - name: Build with Gradle
        run: |
          set -o pipefail
          ./gradlew build compilePlaytestJava --continue 2>&1 | tee build.log

      - name: Publish the build log (port branch)
        if: always()
        run: |
          SHA=$(git rev-parse --short HEAD)
          cp build.log /tmp/build.log 2>/dev/null || exit 0
          git config user.name "playtest-bot"
          git config user.email "playtest-bot@users.noreply.github.com"
          git fetch -q origin playtest-results
          git worktree add -q /tmp/pr origin/playtest-results
          cd /tmp/pr && git checkout -q -B playtest-results
          mkdir -p "port/$SHA" && cp /tmp/build.log "port/$SHA/build.log"
          git add -A && git commit -qm "Port build log for $SHA" && git push -q origin playtest-results || true

      - name: Upload mod jar
        uses: actions/upload-artifact@v6
        with:
          name: ether-manipulator-jar
          path: build/libs/*.jar

  dedicated-server:
    # Boots a real dedicated server with the mod. An integrated (client) server
    # never exercises the server classloader, so a common class that touches a
    # client-only class only crashes here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v5
      - name: Boot dedicated server and wait for "Done"
        run: |
          mkdir -p runs/server && echo 'eula=true' > runs/server/eula.txt
          ./gradlew runServer --no-daemon > server.log 2>&1 &
          PID=$!
          for i in $(seq 1 120); do
            if grep -q 'Done (' server.log; then echo "Server started"; break; fi
            if ! kill -0 $PID 2>/dev/null; then echo "Server exited early"; break; fi
            sleep 5
          done
          kill $PID 2>/dev/null || true
          sleep 5
          if ! grep -q 'Done (' server.log; then echo '--- server.log (tail) ---'; tail -n 150 server.log; exit 1; fi
          if grep -nE 'NoClassDefFoundError|RuntimeDistCleaner|attempted to load class .* for invalid dist|Exception in server tick loop' server.log; then tail -n 150 server.log; exit 1; fi
      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dedicated-server-log
          path: |
            server.log
            runs/server/logs/
