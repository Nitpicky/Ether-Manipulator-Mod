name: Vanilla sound reference
# manual only: downloads and measures some vanilla sounds as a reference for the mix pass (never shipped in the mod)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: which ffmpeg || (sudo apt-get update -q && sudo apt-get install -yq ffmpeg)
      - run: python3 .github/scripts/vanilla_sounds.py
      - name: Publish to the playtest-results branch
        run: |
          git config user.name "playtest-bot"
          git config user.email "playtest-bot@users.noreply.github.com"
          git fetch origin playtest-results
          git worktree add /tmp/pr origin/playtest-results
          cd /tmp/pr && git checkout -B playtest-results
          rm -rf vanilla-ref && cp -r $GITHUB_WORKSPACE/vanilla-ref .
          git add -A && git commit -qm "Vanilla sound reference" && git push -q origin playtest-results
