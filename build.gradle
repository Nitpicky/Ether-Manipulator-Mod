plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

// ---- 26.3 port branch (port/26.3). main stays on 1.21.1. ---------------------
def mcVersion  = '26.3'
def neoVersion = '26.3.0.115'
def geckoVersion = '5.5.6'

group   = 'com.ethermod'
version = '1.0.1+26.3'

base {
    archivesName = 'ether-manipulator'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

// List every compile error at once (the port is fixed in batches from the CI log)
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xmaxerrs', '10000']
}

// Opt-in runtime checks. These classes are never included in the normal jar.
sourceSets {
    playtest {
        java.srcDir 'src/playtest/java'
    }
}

// Port milestone: -PcommonOnly leaves the client out, so the common (server) code can be
// compiled and booted on a dedicated server while the client rendering is still being rewritten
if (project.hasProperty('commonOnly')) {
    sourceSets.main.java {
        exclude 'com/ethermod/client/**'
        ['ChargeArmTremblerMixin', 'ChargeMovementMixin', 'FlightEquipmentMixin',
         'GemGlintMixin', 'GravityCameraMixin', 'PhotonicGlowEntityMixin', 'PhotonicGlowMixin',
         'RenderStateEntityMixin', 'SoulFlameRenderMixin', 'SoundVolumeAccessor'].each {
            exclude "com/ethermod/mixin/${it}.java"
        }
    }
}
configurations {
    playtestImplementation.extendsFrom implementation
}

neoForge {
    version = neoVersion
    addModdingDependenciesTo(sourceSets.playtest)

    mods {
        ethermod {
            sourceSet sourceSets.main
            if (project.hasProperty('playtest')) sourceSet sourceSets.playtest
        }
    }

    runs {
        client {
            client()
            gameDirectory = project.file('runs/client')
            // CI playtest: a fixed 1280x720 window for the screenshots
            if (System.getenv('ETHERMOD_AUTOTEST') != null) {
                programArguments.addAll '--width', '1280', '--height', '720'
            }
            if (project.hasProperty('playtest')) {
                sourceSet = sourceSets.playtest
                systemProperty 'ethermod.playtest', 'true'
                // -PmodelShots runs the scripted first/third-person screenshot tour instead of the UI probe
                def shots = project.hasProperty('modelShots')
                systemProperty 'ethermod.uiProbe', shots ? 'false' : 'true'
                systemProperty 'ethermod.hoverScreenshots', project.hasProperty('hoverTest') ? 'true' : 'false'
                systemProperty 'ethermod.noScreenshots', shots ? 'false' : 'true'
                // -PstopAfter=<tick> ends the screenshot tour early (the shader-pack run only needs the beam)
                if (project.hasProperty('stopAfter')) systemProperty 'ethermod.stopAfter', project.property('stopAfter').toString()
                // -PfxVariant=<name> picks how effects draw with a shader pack (client/Fx.VARIANT)
                if (project.hasProperty('fxVariant')) systemProperty 'ethermod.fxVariant', project.property('fxVariant').toString()
                // -PcloudTest fires the beam from above the clouds instead of the rest of the tour
                if (project.hasProperty('cloudTest')) systemProperty 'ethermod.cloudTest', 'true'
                // -PkGifs records the K screen scenes for the mod page (KGifTour)
                if (project.hasProperty('kGifs')) systemProperty 'ethermod.kGifs', 'true'
            }
        }
        server {
            server()
            gameDirectory = project.file('runs/server')
            programArgument '--nogui'
        }
    }
}

repositories {
    mavenLocal()
    maven { url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/" }
    // GeckoLib 5 for 26.3 isn't on its own maven: CurseForge file 8893169 (NeoForge 5.5.6)
    exclusiveContent {
        forRepository { maven { url = "https://cursemaven.com" } }
        filter { includeGroup "curse.maven" }
    }
}

dependencies {
    implementation "curse.maven:geckolib-388172:8893169" // GeckoLib ${geckoVersion} for ${mcVersion}
    playtestImplementation sourceSets.main.output
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : mcVersion,
            minecraft_version_range: "[${mcVersion},26.4)",
            neo_version            : neoVersion,
            neo_version_range      : '[26.3,)',
            loader_version_range   : '[1,)',
            mod_id                 : 'ethermod',
            mod_name               : 'Ether Manipulator',
            mod_version            : project.version,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

// Port helper: prints the resolved compile classpath (used by the API lookup workflow)
tasks.register('printClasspath') {
    def cp = configurations.compileClasspath
    doLast { cp.files.each { println "CP " + it } }
}
