modLoader="javafml"
loaderVersion="${loader_version_range}"
license="All Rights Reserved"
issueTrackerURL="https://www.curseforge.com/minecraft/mc-mods/ether-manipulator/comments"

[[mods]]
modId="ethermod"
version="${mod_version}"
displayName="Ether Manipulator"
# Square icon in the Mods list (400x400 PNG at the jar root).
iconFile="ethermod_logo.png"
authors="Woomwoomed"
displayURL="https://www.curseforge.com/minecraft/mc-mods/ether-manipulator"
description='''
A Starbound-inspired multitool that replaces every tool: a continuous beam and a charged orb.
Every player owns one from the start. Summon it with R; equip elemental Modules and progress through Prototype, Calibrated, Augmented and Overclocked Tiers.
'''

[[mixins]]
config="ethermod.mixins.json"

[[dependencies.ethermod]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.ethermod]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.ethermod]]
    modId="geckolib"
    type="required"
    versionRange="[5.5,)"
    ordering="AFTER"
    side="BOTH"
