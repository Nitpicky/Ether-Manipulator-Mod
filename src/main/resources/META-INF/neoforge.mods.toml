authors="Woomwoomed"
displayURL="https://www.curseforge.com/minecraft/mc-mods/ether-manipulator"
description='''
Omnitool with a progression system. Use it, it bends the world to your will!
One item for every job: its own slot, no durability, kept on death. Press R to take it in hand and K to open its upgrades.
Find Elemental Gemstones hidden in vanilla structures to unlock Modules, and upgrade it from Prototype to Overclocked.
'''

