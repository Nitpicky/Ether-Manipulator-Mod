modLoader="javafml"
loaderVersion="[4,)"
license="All Rights Reserved"
# TODO(author): issueTrackerURL="https://..."  (where players report bugs)

[[mods]]
modId="ethermod"
version="${mod_version}"
displayName="Ether Manipulator"
# Shown in the Mods list (400x400 PNG at the jar root).
logoFile="ethermod_logo.png"
# TODO(author): authors="..."          (fill in before release; left out until confirmed)
# TODO(author): displayURL="https://..."  (the mod's page)
description='''
A Starbound-inspired multitool that replaces every tool: a continuous beam and a charged orb.
Every player owns one from the start. Summon it with R; equip elemental Modules and progress through Prototype, Calibrated, Augmented and Overclocked Tiers.
'''

[[mixins]]
config="ethermod.mixins.json"

[[dependencies.ethermod]]
    modId="neoforge"
    type="required"
    versionRange="[21.1.265,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.ethermod]]
    modId="minecraft"
    type="required"
    versionRange="[1.21.1,1.22)"
    ordering="NONE"
    side="BOTH"

[[dependencies.ethermod]]
    modId="geckolib"
    type="required"
    versionRange="[4.9.3,)"
    ordering="AFTER"
    side="BOTH"
